# Configuración de Fly.io para el backend de Academia.
# Sin add-ons: el estado está en MongoDB Atlas.
app = "academia-ommex"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4100"
  NODE_ENV = "production"

[http_service]
  internal_port = 4100
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
